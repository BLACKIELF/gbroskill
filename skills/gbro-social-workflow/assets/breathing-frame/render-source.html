<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style><canvas id="bloom" width="1920" height="1080"></canvas><script>
/* 1028v7: reference-inspired outer bloom. Original reference footage is not embedded.
   12 s closed colour flow and full expansion/contraction. */
(() => {
  const canvas=document.getElementById('bloom');
  const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false,preserveDrawingBuffer:true});
  if(!gl) throw new Error('WebGL2 is required for the video frame');
  const vertex=`#version 300 es
  in vec2 position;void main(){gl_Position=vec4(position,0.,1.);}`;
  const fragment=`#version 300 es
  precision highp float;
  uniform float time;
  uniform vec2 resolution;
  uniform vec4 sourceRect;
  out vec4 outColor;
  const float PI=3.141592653589793;
  float roundBox(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
  float lobe(float a,float center,float sharpness){return exp(sharpness*(cos(a-center)-1.));}
  void main(){
    vec2 uv=vec2(gl_FragCoord.x,resolution.y-gl_FragCoord.y);
    vec2 center=sourceRect.xy+sourceRect.zw*.5;
    vec2 halfSize=sourceRect.zw*.5;
    vec2 p=uv-center;
    // Full rectangular video remains untouched, including its corners.
    if(abs(p.x)<halfSize.x && abs(p.y)<halfSize.y){outColor=vec4(0.);return;}
    float d=abs(roundBox(p,halfSize+vec2(7.),24.));
    float phase=time/12.*2.*PI;
    float breath=.5-.5*cos(time/12.*2.*PI);
    float angle=atan(p.y/(halfSize.y+7.),p.x/(halfSize.x+7.));
    float cyan=lobe(angle,phase-2.55,4.0);
    float violet=lobe(angle,phase-.75,3.2);
    float blue=lobe(angle,phase+1.25,3.5);
    float gold=lobe(angle,phase+3.02,8.0)*.72;
    float rose=lobe(angle,phase+.35,6.0)*.68;
    float weights=cyan+violet+blue+gold+rose;
    vec3 tint=(cyan*vec3(.12,.70,1.)+violet*vec3(.56,.13,1.)+blue*vec3(.13,.20,1.)+gold*vec3(.90,.85,.33)+rose*vec3(1.,.25,.62))/max(weights,.001);
    float passage=.5+.5*cos(2.*angle-2.*phase+5.1);
    float activity=.16+.84*pow(passage,.8);
    float spread=.38+1.42*breath;
    float width=(26.+8.*cyan)*spread;
    float shoulder=exp(-d/width);
    float haze=exp(-pow(d/((68.+12.*blue)*spread),2.));
    float edge=exp(-pow(d/1.55,2.));
    float radiance=(.66*shoulder+.25*haze)*activity*(.77+.23*breath);
    float alpha=clamp(radiance+.82*edge*(.12+.88*activity),0.,.98);
    vec3 color=mix(tint,mix(tint,vec3(1.),.62),edge*.82);
    outColor=vec4(color*alpha,alpha);
  }`;
  function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
  const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const position=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
  const time=gl.getUniformLocation(program,'time');gl.uniform2f(gl.getUniformLocation(program,'resolution'),canvas.width,canvas.height);gl.viewport(0,0,canvas.width,canvas.height);
  const duration=12,flowDuration=12,breathDuration=12,sourceRect={x:320.8240223463687,y:90,width:1278.3519553072626,height:900};
  gl.uniform4f(gl.getUniformLocation(program,'sourceRect'),sourceRect.x,sourceRect.y,sourceRect.width,sourceRect.height);
  let origin=performance.now(),base=0,playing=false,raf=0,last=-Infinity,frames=0;
  const wrap=t=>((t%duration)+duration)%duration;
  const current=()=>wrap(base+(playing?(performance.now()-origin)/1000:0));
  function draw(t){gl.uniform1f(time,wrap(t));gl.drawArrays(gl.TRIANGLE_STRIP,0,4);frames++;}
  function tick(t){if(!playing)return;if(t-last>=31){draw(current());last=t;}raf=requestAnimationFrame(tick);}
  function pause(){base=current();playing=false;cancelAnimationFrame(raf);draw(base);}
  function play(){if(playing)return;playing=true;origin=performance.now();last=-Infinity;raf=requestAnimationFrame(tick);}
  function seek(t){base=wrap(t);origin=performance.now();draw(base);}
  const ready=Promise.resolve({sourceRect,transparentVideoInterior:true});
  window.gbroVideoFrame={version:'1028v7',width:canvas.width,height:canvas.height,duration,flowDuration,breathDuration,sourceRect,ready,play,pause,seek,canvas,gl,state:()=>({playing,time:current(),frames})};
  window.__scene=window.gbroVideoFrame;
  draw(0);if(!new URLSearchParams(location.search).has('rec')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)play();
})();
</script>
